# Generates OpenWrist.xcodeproj — run:  cd app && xcodegen
# Kept in git instead of the .xcodeproj so the project is diffable and stable.
name: OpenWrist
options:
  bundleIdPrefix: com.openwrist
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OpenWrist:
    type: application
    platform: iOS
    sources:
      - OpenWrist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openwrist.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "OpenWrist connects to your watch over Bluetooth."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "OpenWrist reads step data to show your activity."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "OpenWrist saves steps from your watch to Apple Health."
        CODE_SIGN_ENTITLEMENTS: OpenWrist/OpenWrist.entitlements
